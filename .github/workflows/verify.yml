name: Verify registry and site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Render the Internet-Draft
        run: |
          python -m pip install xml2rfc==3.34.1
          mkdir -p /tmp/mailschema-rfc
          xml2rfc --text --html --path /tmp/mailschema-rfc ietf/draft-mailschema-mail-action-protocol-00.xml
      - run: npm run packages:prepare && npm run packages:test
      # The Ruby gem must agree with the reference on every shared vector and fixture.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: .release/packages/ruby
      - run: bundle exec rake
        working-directory: .release/packages/ruby
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mailschema-site-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
