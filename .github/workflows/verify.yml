name: Verify registry and site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run packages:prepare && npm run packages:test
      # The Ruby gem must agree with the reference on every shared vector and fixture.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: .release/packages/ruby
      - run: bundle exec rake
        working-directory: .release/packages/ruby
      - run: npm run verify
      - name: Render the submission candidate
        run: |
          python3 -m venv .release/xml2rfc
          .release/xml2rfc/bin/pip install -r ietf/requirements.txt
          mkdir -p .release/ietf/map-0.3
          .release/xml2rfc/bin/xml2rfc --text --html --path .release/ietf/map-0.3 ietf/draft-mailschema-mail-action-protocol-00.xml
      - name: Deploy verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
