[package]
name = "mailschema"
version = "0.1.4"
edition = "2021"
rust-version = "1.70"
description = "Embedded Mail Action Protocol 0.2 core artifacts and MailSchema Registry schemas"
homepage = "https://mailschema.org/tools"
repository = "https://github.com/mailschema/rust"
documentation = "https://docs.rs/mailschema"
license = "MIT"
readme = "README.md"
keywords = ["email", "schema", "json-schema", "agents"]
categories = ["data-structures", "email"]
include = ["src/**", "schemas/**", "contexts/**", "Cargo.toml", "README.md", "LICENSE"]

[dev-dependencies]
serde_json = "1"
