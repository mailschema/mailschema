[package]
name = "mailschema"
version = "0.1.3"
edition = "2021"
rust-version = "1.70"
description = "Embedded JSON Schemas for Mail Action Protocol and the MailSchema Registry"
homepage = "https://mailschema.org/tools"
repository = "https://github.com/mailschema/rust"
documentation = "https://docs.rs/mailschema"
license = "MIT"
readme = "README.md"
keywords = ["email", "schema", "json-schema", "agents"]
categories = ["data-structures", "email"]
include = ["src/**", "schemas/**", "contracts/**", "Cargo.toml", "README.md", "LICENSE"]

[dev-dependencies]
serde_json = "1"
