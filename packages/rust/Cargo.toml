[package]
name = "mailschema"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Embedded JSON Schemas for MailSchema Registry contributions and records"
license = "MIT"
readme = "README.md"
keywords = ["email", "schema", "json-schema", "agents"]
