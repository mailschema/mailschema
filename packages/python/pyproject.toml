[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mailschema"
version = "0.3.0"
description = "Mail Action Protocol 0.3 artifacts: the profile record, context and schemas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MailSchema contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://mailschema.org/tools"
Repository = "https://github.com/mailschema/python"
Issues = "https://github.com/mailschema/python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mailschema"]
