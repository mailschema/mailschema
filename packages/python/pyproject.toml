[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "mailschema"
version = "0.1.0"
description = "JSON Schemas and validation tools for MailSchema Registry contributions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MailSchema contributors" }]
dependencies = ["jsonschema[format]>=4.23,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
mailschema = "mailschema.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailschema"]
